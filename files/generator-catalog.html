<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Infinigen generator catalog</title>
<style>
:root{color-scheme:light;
--surface-0:#f4f4f2;--surface-1:#fcfcfb;--surface-2:#ececea;
--border:#dcdcd8;--border-strong:#c4c4be;
--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#7a7975;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;
--off-ink:#7a7975;--off-bg:#e8e8e4;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
--surface-0:#111110;--surface-1:#1a1a19;--surface-2:#242422;
--border:#33332f;--border-strong:#4a4a45;
--text-primary:#ffffff;--text-secondary:#c3c2b7;--text-muted:#8f8e85;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;
--off-ink:#8f8e85;--off-bg:#242422;}}
:root[data-theme="dark"]{color-scheme:dark;
--surface-0:#111110;--surface-1:#1a1a19;--surface-2:#242422;
--border:#33332f;--border-strong:#4a4a45;
--text-primary:#ffffff;--text-secondary:#c3c2b7;--text-muted:#8f8e85;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;
--off-ink:#8f8e85;--off-bg:#242422;}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);
font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--text-secondary);font-size:13.5px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
.btn{border:1px solid var(--border-strong);background:var(--surface-1);border-radius:8px;
padding:6px 11px;font-size:13px;color:var(--text-secondary)}
.btn:hover{border-color:var(--text-muted)}
.btn[aria-pressed="true"]{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.tabs{display:flex;gap:6px;margin:22px 0 18px;border-bottom:1px solid var(--border)}
.tab{padding:9px 15px;font-size:14px;color:var(--text-secondary);border-bottom:2px solid transparent;
margin-bottom:-1px;border-radius:6px 6px 0 0}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--text-primary);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.tile .n{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.tile .l{font-size:11.5px;color:var(--text-secondary);text-transform:uppercase;
letter-spacing:.055em;margin-top:3px}
.tile .sub{font-size:11.5px;color:var(--text-muted);margin-top:5px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search]{flex:1;min-width:220px;background:var(--surface-1);color:var(--text-primary);
border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
input[type=search]::placeholder{color:var(--text-muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
background:var(--surface-1);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;
color:var(--text-secondary)}
.chip[aria-pressed="true"]{border-color:var(--text-primary);color:var(--text-primary);background:var(--surface-2)}
.chip .dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 2px var(--surface-1)}
.chip .ct{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
.card{background:var(--surface-1);border:1px solid var(--border);border-left:3px solid var(--cat);
border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--border-strong)}
.card .nm{font-size:13.5px;font-weight:600;word-break:break-word;line-height:1.35}
.card .fp{font-size:11px;color:var(--text-muted);word-break:break-all;line-height:1.4}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface-2);
color:var(--text-secondary);border:1px solid var(--border)}
.tag.cat{display:inline-flex;align-items:center;gap:5px}
.tag.cat .dot{width:8px;height:8px;border-radius:2px}
.tag.off{background:var(--off-bg);color:var(--off-ink);border-style:dashed;font-weight:600}
.card.off{opacity:.72}
.card.off .nm{text-decoration:line-through;text-decoration-thickness:1px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface-1);
border:1px solid var(--border);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);
background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
.empty{padding:44px;text-align:center;color:var(--text-muted);
border:1px dashed var(--border-strong);border-radius:10px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);
font-size:12px;color:var(--text-muted);line-height:1.7}
footer .mono{font-size:11.5px}
.fp,.nm{overflow-wrap:anywhere}
@media (max-width:560px){
.wrap{padding:20px 13px 48px}
h1{font-size:19px}
header p{font-size:12.5px}
.grid{grid-template-columns:1fr}
.tiles{grid-template-columns:1fr 1fr;gap:8px}
.tile .n{font-size:22px}
.toprow{gap:10px}
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap}
input[type=search]{min-width:0}
table{display:block;overflow-x:auto}
}
</style>
</head>

full":"stereo_cameras_in_bbox_rand","category":"Cameras","family":"camera","disabled":false,"note":"","rand":true},{"name":"monocular_camera_in_bbox_rand","full":"monocular_camera_in_bbox_rand","category":"Cameras","family":"camera","disabled":false,"note":"","rand":true},{"name":"monocular_360_camera_rand","full":"monocular_360_camera_rand","category":"Cameras","family":"camera","disabled":false,"note":"","rand":true},{"name":"linear_pan_camera_rand","full":"linear_pan_camera_rand","category":"Cameras","family":"camera","disabled":false,"note":"","rand":true},{"name":"orbit_90_camera_rand","full":"orbit_90_camera_rand","category":"Cameras","family":"camera","disabled":false,"note":"","rand":true},{"name":"material_orbit_camera_rand","full":"material_orbit_camera_rand","category":"Cameras","family":"camera","disabled":false,"note":"","rand":true},{"name":"rrt_camera","full":"rrt_camera","category":"Cameras","family":"camera","disabled":false,"note":"","rand":false},{"name":"rrt_camera_fast","full":"rrt_camera_fast","category":"Cameras","family":"camera","disabled":false,"note":"","rand":false},{"name":"random_walk_camera","full":"random_walk_camera","category":"Cameras","family":"camera","disabled":false,"note":"","rand":false},{"name":"stereo_random_walk_camera","full":"stereo_random_walk_camera","category":"Cameras","family":"camera","disabled":false,"note":"","rand":false},{"name":"plastic_opaque_rand","full":"plastic_opaque_rand","category":"Materials & masks","family":"glass/plastic","disabled":false,"note":"","rand":true},{"name":"plastic_translucent_rand","full":"plastic_translucent_rand","category":"Materials & masks","family":"glass/plastic","disabled":false,"note":"","rand":true},{"name":"plastic_grayscale_rand","full":"plastic_grayscale_rand","category":"Materials & masks","family":"glass/plastic","disabled":false,"note":"","rand":true},{"name":"gravel_concrete_rand","full":"gravel_concrete_rand","category":"Materials & masks","family":"stone","disabled": <script type="text/babel" data-presets="react">
const {useState, useMemo} = React;
const DATA = window.__DATA__;

// Categorical hues assigned in FIXED order, never cycled. Text label always accompanies color.
const V1_CATS = ["Nature meshes","Indoor meshes","Materials","Indoor materials","Scatters","Displaced materials"];
const V2_CATS = ["Materials & masks","Objects & scenes","Cameras","Sky & lighting","Display hosts","Renderers & exporters"];
const SLOT = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
const colorFor = (cats, c) => SLOT[cats.indexOf(c)] || "var(--text-muted)";

const SETS = {
  v1: { label: "Infinigen 1.x", cats: V1_CATS,
        source: "tests/assets/list_*.txt at tag v1.15.5, read from GitHub",
        note: "Nature: terrain, plants, creatures, corals. Never installed on this box." },
  v2: { label: "Infinigen 2.0.0a1", cats: V2_CATS,
        source: "logs/list-all.txt - captured infinigen --list, 2026-07-31 20:42",
        note: "What was actually installed here. 102 asset generators; the other 27 are pipeline plumbing." }
};

function Tile(p) {
  return <div className="tile"><div className="n">{p.n}</div><div className="l">{p.l}</div>
    {p.sub ? <div className="sub">{p.sub}</div> : null}</div>;
}

function App() {
  const [set, setSet] = useState("v1");
  const [q, setQ] = useState("");
  const [active, setActive] = useState([]);
  const [showOff, setShowOff] = useState(false);
  const [view, setView] = useState("cards");
  const [theme, setTheme] = useState("light");

  const conf = SETS[set];
  const rows = DATA[set];

  const toggleCat = c => setActive(a => a.indexOf(c) !== -1 ? a.filter(x => x !== c) : a.concat([c]));
  const flipTheme = () => { const t = theme === "light" ? "dark" : "light";
    setTheme(t); document.documentElement.setAttribute("data-theme", t); };

  const filtered = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return rows.slice().sort((a,b)=>(a.disabled?1:0)-(b.disabled?1:0)).filter(r => {
      if (!showOff && r.disabled) return false;
      if (active.length && active.indexOf(r.category) === -1) return false;
      if (!needle) return true;
      return (r.name + " " + r.full + " " + r.family + " " + r.category).toLowerCase().indexOf(needle) !== -1;
    });
  }, [rows, q, active, showOff]);

  const counts = useMemo(() => {
    const m = {};
    rows.forEach(r => { if (showOff || !r.disabled) m[r.category] = (m[r.category] || 0) + 1; });
    return m;
  }, [rows, showOff]);

  const nOff = rows.filter(r => r.disabled).length;
  const nOn = rows.length - nOff;
  const nFam = new Set(rows.map(r => r.family)).size;
  return (
  <div className="wrap">
    <header className="toprow">
      <div>
        <h1>Infinigen generator catalog</h1>
        <p>Every generator in both trees, side by side - 1.x (nature) and 2.0 (indoor).</p>
      </div>
      <div style={{display:"flex",gap:6}}>
        <button className="btn" aria-pressed={view==="cards"} onClick={() => setView("cards")}>Cards</button>
        <button className="btn" aria-pressed={view==="table"} onClick={() => setView("table")}>Table</button>
        <button className="btn" onClick={flipTheme}>{theme === "light" ? "Dark" : "Light"}</button>
      </div>
    </header>

    <div className="tabs" role="tablist">
      {Object.keys(SETS).map(k =>
        <button key={k} className="tab" role="tab" aria-selected={set===k}
          onClick={() => { setSet(k); setActive([]); }}>
          {SETS[k].label}{" "}
          <span style={{color:"var(--text-muted)",fontWeight:400}}>
            ({DATA[k].filter(r => !r.disabled).length})</span>
        </button>)}
    </div>

    <div className="tiles">
      <Tile n={nOn} l="Active generators" sub={conf.cats.length + " categories / " + nFam + " families"}/>
      {nOff > 0
        ? <Tile n={nOff} l="Disabled in-repo" sub="commented out upstream - slow / times out"/>
        : <Tile n={rows.filter(r => r.rand).length} l="Randomised (_rand)" sub="the rest are fixed-behaviour"/>}
      <Tile n={filtered.length} l="Matching filters" sub={(q || active.length) ? "filtered" : "no filters applied"}/>
    </div>

    <div className="controls">
      <input type="search" value={q} onChange={e => setQ(e.target.value)}
        placeholder="Search name, path, family..." aria-label="Search generators"/>
      {nOff > 0 ? <button className="btn" aria-pressed={showOff} onClick={() => setShowOff(v => !v)}>
        {showOff ? "Hide disabled" : "Show " + nOff + " disabled"}</button> : null}
      {(active.length > 0 || q) ?
        <button className="btn" onClick={() => { setActive([]); setQ(""); }}>Clear</button> : null}
    </div>

    <div className="chips">
      {conf.cats.map(c =>
        <button key={c} className="chip" aria-pressed={active.indexOf(c) !== -1} onClick={() => toggleCat(c)}>
          <span className="dot" style={{background:colorFor(conf.cats,c)}}/>
          {c}<span className="ct">{counts[c] || 0}</span>
        </button>)}
    </div>
    {filtered.length === 0
      ? <div className="empty">No generators match.</div>
      : view === "cards"
      ? <div className="grid">
          {filtered.map((r,i) =>
            <div key={i} className={"card" + (r.disabled ? " off" : "")}
                 style={{"--cat": colorFor(conf.cats, r.category)}}>
              <div className="nm mono">{r.name}</div>
              {r.full !== r.name ? <div className="fp mono">{r.full}</div> : null}
              <div className="meta">
                <span className="tag cat">
                  <span className="dot" style={{background:colorFor(conf.cats,r.category)}}/>
                  {r.category}</span>
                <span className="tag">{r.family}</span>
                {r.disabled ? <span className="tag off">disabled{r.note ? " - " + r.note : ""}</span> : null}
              </div>
            </div>)}
        </div>
      : <table><thead><tr>
          <th>Name</th><th>Category</th><th>Family</th><th>Status</th><th>Full path</th>
        </tr></thead><tbody>
          {filtered.map((r,i) =>
            <tr key={i}>
              <td className="mono">{r.name}</td>
              <td><span className="tag cat">
                <span className="dot" style={{background:colorFor(conf.cats,r.category)}}/>
                {r.category}</span></td>
              <td>{r.family}</td>
              <td>{r.disabled ? "disabled" : "active"}</td>
              <td className="mono" style={{color:"var(--text-muted)",fontSize:11}}>{r.full}</td>
            </tr>)}
        </tbody></table>}

    <footer>
      <strong>Source - {conf.label}:</strong> {conf.source}<br/>
      {conf.note}<br/><br/>
      1.x paths are <span className="mono">tests/assets/</span>, not
      <span className="mono"> tests/infinigen/assets/</span> as the handover doc states, and there is no
      <span className="mono"> list_nature_materials.txt</span>. The 29 disabled entries are commented out
      upstream - mostly creatures and palms - with notes such as "slow, fails 120sec timeout".
    </footer>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
